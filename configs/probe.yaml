# Замер поведения модели, не точности. concurrency 1, чтобы задержка была
# настоящей, как у одного пользователя приложения. Потолок 2048 поднят выше
# продуктового, чтобы увидеть естественную длину ответа до того, как выбирать
# потолок для протокола.
# BIRD dev: see README. Override with --data-root or edit this path.
data_root: data/bird
out_dir: results/probe
concurrency: 1
models:
  arctic-7b-q4:
    model: hf.co/mradermacher/Arctic-Text2SQL-R1-7B-GGUF:Q4_K_M
    base_url: http://localhost:11434/v1
    api_key: ollama
    max_tokens: 2048
  xiyan-7b-q4:
    model: hf.co/mradermacher/XiYanSQL-QwenCoder-7B-2504-GGUF:Q4_K_M
    base_url: http://localhost:11434/v1
    api_key: ollama
    max_tokens: 2048
