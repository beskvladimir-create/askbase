# Every push runs what used to be run by hand, and on the oldest Python the
# project claims to support.
#
# That last part is the reason this file exists at all. pyproject says
# requires-python >=3.11, the only machine the checks ever ran on has 3.13, and
# scripts/build_site.py carried a backslash inside an f-string: a syntax error
# before 3.12. The site builder could not start on the lowest supported
# version, and nothing noticed for weeks.
#
# Two environments, as locally: one with the benchmark dependencies, one with
# Qt. scripts/test_all.sh expects them at .venv and desktop/.venv and runs all
# three suites, including the interface, which is the suite that gets skipped
# when somebody runs pytest by hand.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Qt needs these even with the offscreen platform plugin: it still links
      # against EGL and the xkb keymap library at import time.
      - name: System libraries for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Benchmark environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Desktop environment
        run: |
          python -m venv desktop/.venv
          desktop/.venv/bin/python -m pip install --upgrade pip
          desktop/.venv/bin/python -m pip install 'PySide6>=6.7' 'sqlglot>=25.0' 'pytest>=8.0'

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/test_all.sh

      # Not a formality. The build refuses to publish a figure no results file
      # backs, and results/ is not in this repository, so this also proves the
      # pages say what they should when there is no measurement to show.
      - name: Site build
        run: .venv/bin/python scripts/build_site.py --check
