name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The build refuses to publish a figure that no results file backs, so a
      # failure here means a page quotes a measurement that does not exist.
      - run: pip install pyyaml
      - run: python scripts/build_site.py
        env:
          # Pages serves this project repository under /askbase/
          SITE_BASE: https://beskvladimir-create.github.io/askbase
          SITE_PREFIX: /askbase
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
