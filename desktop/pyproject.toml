[project]
name = "askbase-desktop"
version = "0.1.0"
description = "Ask your database in plain words, with the model on your own machine"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "sqlglot>=25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["askbase"]
