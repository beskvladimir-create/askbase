[project]
name = "nl2sql-app"
version = "0.1.0"
description = "Text-to-SQL on the user's own machine: benchmark, engine, desktop app"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",        # OpenAI-compatible client (Ollama, llama.cpp, vLLM)
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "func-timeout>=4.3",   # bound per-query SQLite execution
    "sqlglot>=25.0",       # static SQL check before execution
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pillow>=10.0"]
emb = ["sentence-transformers>=2.7", "numpy>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pinned explicitly rather than left to ruff's defaults. CI runs this, and a
# lint whose rule set changes when the tool updates is a build that goes red
# for reasons nobody asked for.
[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["site", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
    # The project is bilingual on purpose: the interface strings, the error
    # messages and most of the comments are Russian. Flagging Cyrillic as an
    # ambiguous character would mean 138 findings that are all the point.
    "RUF001", "RUF002", "RUF003",
    # Line length is not enforced. The prose in this codebase sits around 80
    # columns by habit, and every line over the limit is an embedded SVG path,
    # a CSS rule or a block of HTML, where a wrap makes the string harder to
    # read rather than easier. A limit that is only ever broken by the cases it
    # should not apply to is a limit that teaches people to add noqa.
    "E501",
]
