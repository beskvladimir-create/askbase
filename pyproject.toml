[project]
name = "nl2sql-app"
version = "0.1.0"
description = "Text-to-SQL on the user's own machine: benchmark, engine, desktop app"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",        # OpenAI-compatible client (Ollama, llama.cpp, vLLM)
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "func-timeout>=4.3",   # bound per-query SQLite execution
    "sqlglot>=25.0",       # static SQL check before execution
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pillow>=10.0"]
emb = ["sentence-transformers>=2.7", "numpy>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
